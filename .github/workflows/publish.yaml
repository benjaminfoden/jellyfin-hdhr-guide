name: 'Publish Plugin'

on:
  workflow_call:
    inputs:
      tag:
        description: 'The release tag to build assets for and attach them to.'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to build assets for and attach them to.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@master

  upload:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: build-artifact
      - name: Compute checksums
        run: |
          for file in ./*; do
            md5sum "${file#./}" >> "${file%.*}.md5"
            sha256sum "${file#./}" >> "${file%.*}.sha256"
          done
          ls -l
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" ./* --repo "${{ github.repository }}" --clobber

  generate-manifest:
    runs-on: ubuntu-latest
    needs:
      - upload
    steps:
      - name: Generate manifest.json
        uses: Kevinjil/jellyfin-plugin-repo-action@v0.4.3
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pagesBranch: gh-pages
          pagesFile: manifest.json
