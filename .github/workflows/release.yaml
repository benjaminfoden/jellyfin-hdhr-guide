name: 'Cut Release'

on:
  push:
    branches:
      - main
    paths:
      - 'build.yaml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether build.yaml's version is a new release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(yq '.version' build.yaml)
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release found for $TAG; will create one."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create tag and release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          yq '.changelog' build.yaml > /tmp/changelog.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

          gh release create "$TAG" --title "$TAG" --notes-file /tmp/changelog.md
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  publish:
    needs: release
    uses: ./.github/workflows/publish.yaml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
