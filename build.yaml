overview: "Feeds Jellyfin's XMLTV listings provider from your HDHomeRun tuners' guide data"
description: >
  Discovers the HDHomeRun tuners already configured in Jellyfin's Live TV settings
  (or manually specified addresses), reads each tuner's local DeviceAuth token, and
  points Jellyfin's built-in XMLTV listings provider at SiliconDust's official guide
  feed for those devices. Runs entirely inside the Jellyfin server - no external
  containers or services required.
